use_default_settings:
  engines:
    # Restrict general web discovery to the verified backend.
    keep_only:
      - bing
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
search:
  formats:
    - html
    - json
outgoing:
  proxies:
    all://:
      # Replaced at container startup from the private LDR_SEARCH_PROXY_URL
      # environment variable. Do not put proxy credentials in this file.
      - "__LDR_SEARCH_PROXY_URL__"

# Verified fallback while rate-limited providers are paused.
engines:
  - name: bing
    disabled: false
