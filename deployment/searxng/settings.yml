use_default_settings:
  engines:
    # Restrict general web discovery to the verified backend.
    keep_only:
      - bing
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
search:
  formats:
    - html
    - json
# The entrypoint adds outgoing.proxies when LDR_SEARCH_PROXY_URL is set.

# Verified fallback while rate-limited providers are paused.
engines:
  - name: bing
    disabled: false
