# ============================================================================
# DOCKER COMPOSE BASE CONFIGURATION (CPU-only, works on all platforms)
# ============================================================================
# This base configuration works on:
#   - macOS (M1/M2/M3/M4 Apple Silicon and Intel)
#   - Windows
#   - Linux (with or without GPU)
#   - Unraid (via Docker Compose Manager plugin)
#
# To add NVIDIA GPU acceleration:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.override.yml up -d
#
# See docker-compose.gpu.override.yml for GPU setup details.
# Future: docker-compose.amd.override.yml will support AMD GPUs.
#
# For Unraid users: See docs/deployment/unraid.md for complete setup guide
# ============================================================================

services:
  local-deep-research:
    # Derived image extends the official one by installing the `ddgs` package
    # (required by the Wayback engine for DuckDuckGo URL discovery).
    build:
      context: .
      dockerfile: Dockerfile
    image: localdeepresearch/local-deep-research:ldr-ddgs

    networks:
      - ldr-network

    # Enable host.docker.internal on Linux (already works on Mac/Windows)
    # This allows containers to reach services on the host machine (e.g., LM Studio)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "5000:5000"
    environment:
      # ============================================================================
      # Full configuration reference: docs/CONFIGURATION.md
      # ============================================================================
      # IMPORTANT: Almost all settings can be configured through the web interface.
      #
      # Environment variables FORCE settings and prevent ANY changes through the UI.
      # These are NOT defaults - they are permanent overrides that lock the setting.
      # Only use environment variables if you want to enforce specific settings
      # that users should NEVER be able to change.
      #
      # After starting the container, configure your settings at:
      # http://localhost:5000/settings
      # ============================================================================

      # ============================================================================
      # DOCKER-SPECIFIC SETTINGS (Forced for good reasons!)
      # These settings are forced to ensure proper Docker operation:
      # - Prevents accidental misconfiguration that would break the container
      # - Ensures consistency between Docker configuration and application settings
      # - Users can still change ports via Docker's port mapping (see below)
      # ============================================================================
      - LDR_WEB_HOST=0.0.0.0                 # Must bind to all interfaces for Docker networking
      - LDR_WEB_PORT=5000                    # Internal port must match Docker's expectation
      - LDR_DATA_DIR=/data                   # Must match the volume mount point
      # Use host timezone so container log timestamps match the host (i.e. CST/Asia-Shanghai)
      - TZ=Asia/Shanghai

      # ============================================================================
      # TO CHANGE PORTS: Use Docker port mapping, NOT the settings above!
      # Example - to expose on port 8080 instead of 5000:
      #   ports:
      #     - "8080:5000"  # Maps host port 8080 to container port 5000
      #
      # This is the Docker way and avoids configuration mismatches.
      # ============================================================================

      # ============================================================================
      # DOCKER-COMPOSE SERVICE ENDPOINTS (Forced for proper container networking)
      # These are required for containers to communicate with each other.
      # Docker containers cannot use 'localhost' to reach other containers.
      # These settings override UI configuration for Docker Compose deployments.
      # Env-locking the SearXNG URL also marks it operator-provisioned, which
      # satisfies the private-engine-URL protection (v1.10.3+). pip/local
      # installs using the localhost default must approve it instead, e.g.
      # LDR_SEARCH_PRIVATE_ENGINE_URL_ALLOWLIST=http://localhost:8080 —
      # see docs/SearXNG-Setup.md.
      # ============================================================================
      # SearXNG 接入：指向 searxng-mine（宿主 8888 端口，bridge 网络 172.17.0.2）。
      # 原 compose `searxng:8080` 实例未配 outgoing.proxies 且不开 json，引擎全挂(0结果)。
      - LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL=http://host.docker.internal:8888
      - LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_RESULT_FORMAT=json

      # ============================================================================
      # SECURITY: Disable user registration (recommended for public deployments)
      # When set to false, no new accounts can be created through the web UI.
      # Register your initial account FIRST, then set this to false.
      # ============================================================================
      # - LDR_APP_ALLOW_REGISTRATIONS=false

      # ============================================================================
      # ADVANCED: Uncomment ONLY if you need to enforce/lock these settings
      # WARNING: This will disable UI configuration for these settings!
      # ============================================================================
      # - LDR_LLM_PROVIDER=ollama              # Lock the LLM provider
      # - LDR_LLM_MODEL=gemma3:12b              # Lock the model selection
      # - LDR_LLM_OPENAI_API_KEY=<your-api-key>        # Lock OpenAI API key
      # - LDR_LLM_ANTHROPIC_API_KEY=<your-api-key> # Lock Anthropic API key

      # ============================================================================
      # OPENROUTER CONFIGURATION
      # To use OpenRouter (100+ models via one API), uncomment these lines:
      # Get your API key from https://openrouter.ai/
      # Browse models at https://openrouter.ai/models
      # ============================================================================
      # - LDR_LLM_PROVIDER=openai_endpoint
      # - LDR_LLM_OPENAI_ENDPOINT_URL=https://openrouter.ai/api/v1
      # - LDR_LLM_OPENAI_ENDPOINT_API_KEY=<your-api-key>
      # - LDR_LLM_MODEL=anthropic/claude-3.5-sonnet  # or any OpenRouter model

      # ============================================================================
      # OTHER OPENAI-COMPATIBLE APIS
      # The same pattern works for any OpenAI-compatible service:
      # ============================================================================
      # - LDR_LLM_PROVIDER=openai_endpoint
      # - LDR_LLM_OPENAI_ENDPOINT_URL=https://your-provider.com/v1
      # - LDR_LLM_OPENAI_ENDPOINT_API_KEY=<your-api-key>
      # - LDR_LLM_MODEL=<your-model-name>

      # ============================================================================
      # LM STUDIO (Running on Host Machine)
      # If using LM Studio on your host, use host.docker.internal to reach it.
      # The extra_hosts setting above enables this on Linux.
      # ============================================================================
      # - LDR_LLM_PROVIDER=lmstudio
      # - LDR_LLM_LMSTUDIO_URL=http://host.docker.internal:1234
      # - LDR_LLM_LMSTUDIO_API_KEY=<api-key-if-required>   # optional; leave out for unauth instances
      # - LDR_LLM_MODEL=<your-loaded-model-name>
      # xyconfig_ning
      # ==========================================================
      # LLM 模型配置（2026-09-18 更新）
      # 当前生成模型: deepseek-v4-flash @ pi local-vllm 端点
      #   端点 http://27.30.76.162:6183/v1  (需 API key ${LDR_BENCHMARK_EVALUATION_ENDPOINT_API_KEY}, 1M context, 支持 tool-call)
      # 其他可用（切换时改动下面 URL/MODEL/API_KEY 三处并重建）:
      #   - deepseek-v4.1-flash @ http://10.0.11.40:8000/v1 (key EMPTY, 1M)
      #   - S1-DeepResearch-32B  @ http://27.30.76.162:6183/ai/v1 (免key, 32K, 无tool-call)
      # ==========================================================
      - LDR_LLM_PROVIDER=openai_endpoint
      - LDR_LLM_OPENAI_ENDPOINT_URL=http://27.30.76.162:6183/v1
      - LDR_LLM_OPENAI_ENDPOINT_API_KEY=${LDR_BENCHMARK_EVALUATION_ENDPOINT_API_KEY}
      - LDR_LLM_MODEL=deepseek-v4-flash
      - LDR_LLM_STREAM_USAGE=false

      # BIOINFORMATICS QUALITY PROFILE: prefer formal academic publications.
      # OpenAlex is the broad primary source; PubMed remains available as the
      # biomedical authority.  Preprint and general-web agents are disabled
      # to avoid arXiv rate limits and non-literature citations.
      # 主搜索工具：openalex 免费额度已耗尽返回429空结果，切换为 searxng(可用的元搜索)。
      - LDR_SEARCH_TOOL=searxng
      - LDR_SEARCH_SKIP_RELEVANCE_FILTER=false
      - LDR_SEARCH_MAX_RESULTS=12
      - LDR_SEARCH_MAX_FILTERED_RESULTS=6
      - LDR_SEARCH_JOURNAL_REPUTATION_THRESHOLD=7
      - LDR_SEARCH_JOURNAL_REPUTATION_EXCLUDE_NON_PUBLISHED=true
      - LDR_SEARCH_ENGINE_WEB_ARXIV_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_ARXIV_USE_IN_AUTO_SEARCH=false
      - LDR_SEARCH_ENGINE_WEB_SEARXNG_AGENT_ENABLED=true
      - LDR_SEARCH_ENGINE_WEB_SEARXNG_USE_IN_AUTO_SEARCH=true
      - LDR_SEARCH_ENGINE_WEB_WIKIPEDIA_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_WIKIPEDIA_USE_IN_AUTO_SEARCH=false
      - LDR_SEARCH_ENGINE_WEB_WIKINEWS_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_WIKINEWS_USE_IN_AUTO_SEARCH=false
      - LDR_SEARCH_ENGINE_WEB_WAYBACK_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_WAYBACK_USE_IN_AUTO_SEARCH=false
      # Bound fan-out across simultaneous users and LangGraph sub-agents.
      # 并发上限：全局最多同时 10 个研究进程；每用户最多同时 2 个。
      # （此前被改为 2 / 1，导致容量过紧 —— 单个用户并发被限为 1，
      #  全局槽被占满后新任务即返回 429 “Server is at research capacity”。
      #  每用户 2 避免单用户占满全部全局槽后饿死其他用户。）
      - LDR_SERVER_MAX_CONCURRENT_RESEARCH=10
      - LDR_APP_MAX_CONCURRENT_RESEARCHES=2
      - LDR_LANGGRAPH_AGENT_MAX_SUBAGENT_WORKERS=2
      - LDR_LANGGRAPH_AGENT_MAX_SUB_ITERATIONS=4
      - LDR_LANGGRAPH_AGENT_MAX_ITERATIONS=20
      - LDR_LANGGRAPH_AGENT_MAX_UNIQUE_SOURCES=80
      - LDR_GENERAL_ENABLE_FACT_CHECKING=true

      # ============================================================================
      # 科研验证链（research_verify）—— §0.1 地基开关
      # 校验 = 标注/剔除/留痕，绝不静默通过、也不整篇失败；断网降级 unverified。
      # 总开关 LDR_VERIFY_ENABLE_VERIFY + 各模块开关（可逐个灰度/回滚）。
      # 阈值/超时/并发亦可在此或容器 env 覆盖。
      # ============================================================================
      - LDR_VERIFY_ENABLE_VERIFY=true
      - LDR_VERIFY_ENABLE_DOI_VALIDATION=true
      - LDR_VERIFY_ENABLE_CONSTRAINT_MATCH=true
      - LDR_VERIFY_ENABLE_KEYWORD_COVERAGE=true
      - LDR_VERIFY_ENABLE_CITATION_QC=true
      - LDR_VERIFY_HTTP_TIMEOUT=10
      - LDR_VERIFY_HTTP_MAX_RETRIES=2
      - LDR_VERIFY_HTTP_CONCURRENCY=8
      - LDR_VERIFY_CROSSREF_MAILTO=${LDR_VERIFY_CROSSREF_MAILTO}

      # ============================================================================
      # BENCHMARK EVALUATION (判卷) MODEL — 与生成模型同端点（pi local-vllm /v1）
      # ============================================================================
      - LDR_BENCHMARK_EVALUATION_PROVIDER=openai_endpoint
      - LDR_BENCHMARK_EVALUATION_MODEL=deepseek-v4-flash
      - LDR_BENCHMARK_EVALUATION_ENDPOINT_URL=http://27.30.76.162:6183/v1
      - LDR_BENCHMARK_EVALUATION_ENDPOINT_API_KEY=${LDR_BENCHMARK_EVALUATION_ENDPOINT_API_KEY}
      - LDR_BENCHMARK_EVALUATION_TEMPERATURE=0

      # ============================================================================
      # FILE LOGGING (文件日志) — 记录每次 research 的用户提问 query 明文到
      # /data/logs/ldr_web.log，供管理员/开发查看用户提问。测试阶段开 true；
      # 生产阶段可改为 false（不记录，保持加密隐私）。
      # ============================================================================
      - LDR_ENABLE_FILE_LOGGING=true
      # 用户提问（username+query）单独记录文件，落盘到宿主可访问的 /var/ldr-userlog
      - LDR_USER_QUESTIONS_LOG=/var/ldr-userlog/user_questions.log

      # proxyconfig_ning
      # LLM 端点必须加入 NO_PROXY，否则请求会走 host.docker.internal:2081 代理而被拒
      # (27.30.76.162=pi端点, 10.0.11.40=备用vllm)
      # 注：2080 为宿主机 sing-box(仅监听127.0.0.1)，经 singbox-relay 转发到 2081 供容器访问
      - HTTP_PROXY=http://host.docker.internal:2081
      - HTTPS_PROXY=http://host.docker.internal:2081
      - NO_PROXY=localhost,127.0.0.1,::1,*.local,host.docker.internal,searxng,110.40.189.141,27.30.76.162,10.0.11.40,api.openalex.org

      - http_proxy=http://host.docker.internal:2081
      - https_proxy=http://host.docker.internal:2081
      - no_proxy=localhost,127.0.0.1,::1,*.local,host.docker.internal,searxng,110.40.189.141,27.30.76.162,10.0.11.40,api.openalex.org

      # SEARCH ENGINE API KEYS CONFIG_ning
      - LDR_SEARCH_ENGINE_WEB_BRAVE_API_KEY=${LDR_SEARCH_ENGINE_WEB_BRAVE_API_KEY}
      - LDR_SEARCH_ENGINE_WEB_TAVILY_API_KEY=${LDR_SEARCH_ENGINE_WEB_TAVILY_API_KEY}
      - LDR_SEARCH_ENGINE_WEB_SERPAPI_API_KEY=${LDR_SEARCH_ENGINE_WEB_SERPAPI_API_KEY}
      - LDR_SEARCH_ENGINE_WEB_SERPER_API_KEY=${LDR_SEARCH_ENGINE_WEB_SERPER_API_KEY}
      - LDR_SEARCH_ENGINE_WEB_GITHUB_API_KEY=${LDR_SEARCH_ENGINE_WEB_GITHUB_API_KEY}
      - LDR_SEARCH_ENGINE_WEB_OPENALEX_EMAIL=${LDR_VERIFY_CROSSREF_MAILTO}
      - LDR_SEARCH_ENGINE_WEB_EXA_API_KEY=${LDR_SEARCH_ENGINE_WEB_EXA_API_KEY}

      # PubMed/NCBI API key：把 eutils 请求额度从匿名 3req/s 提升到 10req/s，
      # 缓解 PubMed 429 限流（单细胞/生信类调研的核心数据源）。
      # requires_api_key=true 才会让引擎工厂读取并附加 api_key 参数。
      - LDR_SEARCH_ENGINE_WEB_PUBMED_REQUIRES_API_KEY=true
      - LDR_SEARCH_ENGINE_WEB_PUBMED_API_KEY=${LDR_SEARCH_ENGINE_WEB_PUBMED_API_KEY}

      # 禁用 Semantic Scholar（无 API key，匿名配额易触发 429；不参与自动搜索、不注册为 agent 工具）
      - LDR_SEARCH_ENGINE_WEB_SEMANTIC_SCHOLAR_USE_IN_AUTO_SEARCH=false
      - LDR_SEARCH_ENGINE_WEB_SEMANTIC_SCHOLAR_AGENT_ENABLED=false

      # ============================================================================
      # 精简：关闭配额已废/失效的引擎（2026-09-28 容器内实测）
      #   Brave=402 配额用尽 / Tavily=432 额度超限 / SerpAPI=429 搜索耗尽 /
      #   Exa=402 余额不足 / GitHub=401 key 失效。
      # 这些引擎即使配了 key 也调不通，注册成 LLM 工具只会空耗并污染日志，
      # 故 agent_enabled=false + use_in_auto_search=false 双重关闭。
      # （OpenAlex 实测已恢复返回结果，保留；PubMed/Serper/SearXNG 正常，保留）
      # ============================================================================
      - LDR_SEARCH_ENGINE_WEB_BRAVE_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_BRAVE_USE_IN_AUTO_SEARCH=false
      - LDR_SEARCH_ENGINE_WEB_TAVILY_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_TAVILY_USE_IN_AUTO_SEARCH=false
      - LDR_SEARCH_ENGINE_WEB_SERPAPI_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_SERPAPI_USE_IN_AUTO_SEARCH=false
      - LDR_SEARCH_ENGINE_WEB_EXA_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_EXA_USE_IN_AUTO_SEARCH=false
      - LDR_SEARCH_ENGINE_WEB_GITHUB_AGENT_ENABLED=false
      - LDR_SEARCH_ENGINE_WEB_GITHUB_USE_IN_AUTO_SEARCH=false
    volumes:
      - ldr_data:/data
      - ldr_scripts:/scripts
      # 宿主机可访问的“用户提问”日志目录（bind 到非 /data 路径，避开 entrypoint 的 chmod 700）
      - /data/ningh/nh/ldr-logs:/var/ldr-userlog
      # ============================================================================
      # NOTE: Do NOT add resource limits (deploy.resources.limits) here.
      # Resource needs vary by deployment (RAM, CPU, workload). Deployers should
      # use docker-compose.override.yml to set limits for their environment.
      # ============================================================================
      # NOTE: Local document collections are managed via the Collections UI,
      # not via Docker volume mounts. Do not add local_collections mounts here.
      # ============================================================================
    # Allow SQLCipher mlock() without noisy kernel warnings
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # ============================================================================
    # CONTAINER SECURITY — Principle of Least Privilege
    # ============================================================================
    # The entrypoint (scripts/ldr_entrypoint.sh) runs as root to fix Docker
    # volume ownership, then drops to ldruser (UID 1000) via setpriv before
    # starting the application. The privilege timeline is:
    #
    #   1. Root phase (brief): mkdir, chmod, chown on /data and /home/ldruser
    #   2. setpriv exec: irreversible switch to ldruser (empty capability set)
    #   3. App phase: runs as ldruser with zero capabilities
    #
    # We drop ALL capabilities, then add back only what the root phase needs.
    # no-new-privileges prevents re-escalation after setpriv drops privileges.
    #
    # WARNING: Removing cap_add entries will break container startup — the
    # entrypoint will fail with "Operation not permitted" on chown/chmod.
    # This is especially visible in restricted environments (Proxmox LXC).
    #
    # KEEP IN SYNC: README.md's Security section advertises this hardening
    # (cap_drop: ALL, no-new-privileges, non-root runtime, digest-pinned
    # images). If you change any of those here, update that section to match.
    # ============================================================================
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN        # chown -R ldruser:ldruser /data
      - FOWNER       # chmod on files not owned by root (after chown to ldruser)
      - DAC_OVERRIDE # mkdir in /home/ldruser (.config dir, mode 755 = no write for others)
      - SETUID       # setpriv setuid() syscall to switch to ldruser
      - SETGID       # setpriv setgid() syscall to switch group
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_started


  searxng:
    image: searxng/searxng:latest@sha256:6dd0dffc05a75d92bbacd858953b4e93b8f709403c3fb1fb8a33ca8fd02e40a4
    container_name: searxng
    networks:
      - ldr-network
    # network_mode: "host"
    security_opt:
      - "no-new-privileges:true"
    # Note: no cap_drop here — upstream removed cap_drop: ALL from their
    # official compose in searxng/searxng-docker@31acd45 ("[fix] remove
    # security cap", 2025-05-20), and the new container template at
    # searxng/searxng/container/docker-compose.yml ships with no cap_drop /
    # cap_add at all. The searxng entrypoint runs as root, copies config
    # into the volume, and drops to the searxng user — chasing the exact
    # cap_add list across uWSGI→Granian and future entrypoint changes is
    # not worth the maintenance cost. no-new-privileges and the pinned
    # digest are the meaningful guardrails. See #3874.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - searxng_data:/etc/searxng
    restart: unless-stopped
    extra_hosts:                           # ← 添加这一整段
      - "host.docker.internal:host-gateway"
    environment:
      - HTTP_PROXY=http://host.docker.internal:2081
      - HTTPS_PROXY=http://host.docker.internal:2081
      - NO_PROXY=localhost,127.0.0.1,::1,*.local,searxng
      - http_proxy=http://host.docker.internal:2081
      - https_proxy=http://host.docker.internal:2081
      - no_proxy=localhost,127.0.0.1,::1,*.local,searxng


volumes:
  ldr_data:
  ldr_scripts:
  searxng_data:
networks:
  ldr-network:
